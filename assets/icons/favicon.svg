<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="cyber-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Dark rounded badge background -->
    <rect width="64" height="64" rx="14" fill="#0b0e14" />
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#cyber-grad)" stroke-width="1.8" stroke-opacity="0.8" />
    
    <!-- Cyber grid lines -->
    <path d="M8 32H56M32 8V56" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Monogram RG -->
    <text x="32" y="41" font-family="'Space Mono', monospace, -apple-system, sans-serif" font-size="25" font-weight="700" fill="url(#cyber-grad)" text-anchor="middle" letter-spacing="-1.5" filter="url(#neon-glow)">RG</text>
    
    <!-- Corner status pulse dot -->
    <circle cx="50" cy="14" r="3.5" fill="#10b981" />
    <circle cx="50" cy="14" r="5" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
</svg>
